<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">HelloChengQu - 小爱语音控制乘趣车控</title>
  <desc id="desc">通过小爱同学语音、LSPosed 桥接和 ACK 确认广播，在 Android 14 锁屏环境下控制车辆。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <path d="M48 350H1152" stroke="#243244" stroke-width="2"/>
  <path d="M48 78H620" stroke="#67e8f9" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="64" y="66" fill="#67e8f9" font-size="20" font-weight="700" letter-spacing="3">ANDROID / LSPOSED MODULE</text>
    <text x="64" y="152" fill="#f8fafc" font-size="64" font-weight="800">HelloChengQu</text>
    <text x="68" y="198" fill="#bae6fd" font-size="27" font-weight="600">小爱语音 ➜ 乘趣车控</text>
    <text x="68" y="247" fill="#cbd5e1" font-size="23">一句话控制你的车，锁屏也能用。</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <rect x="68" y="286" width="218" height="42" rx="21" fill="#123047" stroke="#25627c"/>
      <text x="91" y="313" fill="#a5f3fc">Android 14+</text>
      <rect x="298" y="286" width="172" height="42" rx="21" fill="#123047" stroke="#25627c"/>
      <text x="322" y="313" fill="#a5f3fc">ACK retry</text>
      <rect x="482" y="286" width="150" height="42" rx="21" fill="#123047" stroke="#25627c"/>
      <text x="508" y="313" fill="#a5f3fc">Root</text>
    </g>
  </g>
  <g transform="translate(746 61)">
    <rect x="0" y="0" width="380" height="278" rx="22" fill="#0f1d2d" stroke="#2c465d" stroke-width="2"/>
    <text x="28" y="40" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="17">VOICE_COMMAND_PIPELINE</text>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="700">
      <rect x="28" y="66" width="142" height="54" rx="14" fill="#164e63"/>
      <text x="50" y="99" fill="#cffafe">小爱同学</text>
      <path d="M178 93H202" stroke="#67e8f9" stroke-width="3"/>
      <path d="M196 86l9 7-9 7" fill="none" stroke="#67e8f9" stroke-width="3"/>
      <rect x="210" y="66" width="142" height="54" rx="14" fill="#1e3a5f"/>
      <text x="230" y="99" fill="#dbeafe">HelloChengQu</text>
      <path d="M99 134V157" stroke="#67e8f9" stroke-width="3"/>
      <path d="M92 151l7 9 7-9" fill="none" stroke="#67e8f9" stroke-width="3"/>
      <rect x="28" y="166" width="324" height="54" rx="14" fill="#172554"/>
      <text x="103" y="199" fill="#dbeafe">乘趣车控广播</text>
    </g>
    <g font-family="ui-monospace,monospace" font-size="16">
      <circle cx="45" cy="249" r="7" fill="#4ade80"/>
      <text x="62" y="255" fill="#86efac">ACK confirmed</text>
      <text x="232" y="255" fill="#94a3b8">LOCKSCREEN READY</text>
    </g>
  </g>
  <text x="64" y="385" fill="#64748b" font-family="ui-monospace,monospace" font-size="16">voice intent  →  command bridge  →  vehicle action</text>
</svg>